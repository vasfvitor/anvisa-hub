name: Publish site

# The page's numbers are read at build time from two live files: the manifest of anvisa-api (published
# at 21:00 UTC on days with new data, often late) and the meta.json of anvisa-feeds (09:00 UTC daily).
# Instead of guessing the hour, the cron passes a few times a day and only publishes when one of the two
# moved against what the site was built from (/build.json), or when the feeds crawl has stopped and the
# published site does not say so yet (scripts/verify.sh). Push and manual dispatch always publish.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 9 * * *" # after the feeds crawl
    - cron: "30 22 * * *" # after the data pipeline
    - cron: "30 1 * * *" # the pipeline's cron drifts
  workflow_dispatch:

# Least privilege: nothing by default; each job asks for the scope it uses.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checks out scripts/verify.sh; the sources it reads are public URLs
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job pushes nothing
          sparse-checkout: scripts

      # publishes when a source moved, or when the crawl stopped and the site does not say so yet
      - name: Compare the live sources with what the site was built from
        id: compare
        env:
          EVENT: ${{ github.event_name }}
          # the same as src/lib/config.ts and `site` in astro.config.mjs
          MANIFEST: https://vasfvitor.github.io/anvisa-api/manifest.json
          FEEDS_META: https://anvisa.feeds.abelhaninja.de/meta.json
          PUBLISHED: https://anvisa.abelhaninja.de/build.json
        run: bash scripts/verify.sh

  publish:
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # reads the repository
      pages: write # publishes to GitHub Pages
      id-token: write # OIDC required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job pushes nothing

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # after pnpm: `cache: pnpm` needs pnpm on the PATH
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # format and lint first: they fail fast and need no network (lint runs astro sync before)
      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm test

      # check and build read the live sources (empty PUBLIC_* variables fall back to config.ts)
      - run: pnpm check

      - name: Build
        run: pnpm build

      # no client JavaScript, and none of frases-proibidas.txt in the built text
      - run: pnpm check:dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      # GitHub's artifact service sometimes answers "No artifacts named github-pages were found" right after a
      # successful upload (7 deploys on 2026-11-24/25). One retry two minutes later, never more: if it fails
      # too, the job is red as before.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait before the one retry of the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 120

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
